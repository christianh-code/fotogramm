
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">

    <link rel="icon" type="image/svg+xml" href="./assets/icon/fav-logo.svg">

    <script src="./script.js" defer></script>

    <title>Fotogram</title>
</head>

<body onload="renderGallery()">

    <header>
        <div class="header-section">
            <img src="./assets/icon/Logo.png" alt="Fotogram logo">
        </div>
    </header>

    <main class="main-section">
        <h1>Your personal photo album</h1>
        <div id="gallery"></div>
    </main>

    <div id="overlaySection"></div>

    <footer class="footer">
        <div class="dalogo">
            <img src="./assets/icon/da_logo.svg" alt="Developer Akademie logo">
            <h2>Developer Akademie</h2>
        </div>

        <div class="copyright">
            <p>© 2023 Developer Akademie GmbH</p>
        </div>
    </footer>

</body>
</html>
